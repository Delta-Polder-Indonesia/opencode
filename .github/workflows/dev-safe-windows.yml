name: dev-safe (Windows)

# Uji alat bantu dev untuk Windows: script/dev-safe.ps1 + script/dev-safe.cmd.
# Hasilnya tampil sebagai tabel di halaman run (step summary) dan sebagai
# anotasi error kalau ada yang gagal.
#
# Jalankan manual dari tab Actions ("Run workflow"), atau otomatis setiap kali
# file di bawah ini berubah.

on:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Sekalian uji server opencode sungguhan (unduh dari npm, lebih lama)"
        type: boolean
        default: true
  push:
    paths:
      - "script/dev-safe.ps1"
      - "script/dev-safe.cmd"
      - "script/dev-safe.tests.ps1"
      - ".github/workflows/dev-safe-windows.yml"
  pull_request:
    paths:
      - "script/dev-safe.ps1"
      - "script/dev-safe.cmd"
      - "script/dev-safe.tests.ps1"
      - ".github/workflows/dev-safe-windows.yml"

permissions:
  contents: read

concurrency:
  group: dev-safe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Uji di Windows
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Info lingkungan
        run: |
          Write-Host "Runner   : $env:RUNNER_OS $env:RUNNER_ARCH"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
          Write-Host "pwsh     : $((Get-Command pwsh).Source)"

      - name: Cek sintaks PowerShell (parser asli)
        run: |
          # Catatan: jangan pakai nama variabel $error — itu variabel otomatis
          # PowerShell yang read-only dan membuat skrip ini berhenti.
          $files = @("script/dev-safe.ps1", "script/dev-safe.tests.ps1")
          $failed = $false
          foreach ($file in $files) {
            try {
              $tokens = $null
              $parseErrors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$parseErrors)
              if ($parseErrors.Count -gt 0) {
                $failed = $true
                foreach ($parseError in $parseErrors) {
                  Write-Host "::error file=$file,line=$($parseError.Extent.StartLineNumber)::$($parseError.Message)"
                }
              } else {
                Write-Host "Sintaks OK: $file ($($tokens.Count) token)"
              }
            } catch {
              $failed = $true
              Write-Host "::error file=$file::Pemeriksaan sintaks gagal: $($_.Exception.Message)"
            }
          }
          if ($failed) { exit 1 }

      - name: Pastikan nama variabel terlarang tidak dipakai
        run: |
          # $error, $args, $input, $host, $true/$false dll. adalah variabel
          # otomatis PowerShell; menimpanya membuat skrip berhenti saat runtime.
          $forbidden = @('$error', '$true', '$false', '$host', '$input', '$args')
          $violations = 0
          foreach ($file in @("script/dev-safe.ps1", "script/dev-safe.tests.ps1")) {
            foreach ($name in $forbidden) {
              $pattern = "foreach\s*\(\s*" + [regex]::Escape($name) + "\s+in\b"
              $found = Select-String -Path $file -Pattern $pattern -ErrorAction SilentlyContinue
              foreach ($match in $found) {
                $violations++
                Write-Host "::error file=$file,line=$($match.LineNumber)::$name adalah variabel otomatis read-only dan tidak boleh dipakai sebagai variabel loop"
              }
            }
          }
          if ($violations -gt 0) { exit 1 }
          Write-Host "Tidak ada penimpaan variabel otomatis."

      - name: Pasang opencode dari npm
        id: install
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_e2e }}
        run: |
          npm install -g opencode-ai@latest
          Write-Host "== Semua kandidat perintah opencode =="
          Get-Command opencode -All -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "  $($_.CommandType)  $($_.Source)"
          }
          # npm membuat beberapa shim di Windows (.cmd, .ps1, .exe). Untuk dijalankan
          # sebagai proses, .cmd/.exe paling dapat diandalkan; .ps1 dijalankan di
          # dalam sesi PowerShell dan bisa mengakhiri skrip pemanggilnya.
          $candidates = Get-Command opencode -All -ErrorAction SilentlyContinue
          $command = $candidates | Where-Object { $_.Source -match '\.(exe|cmd)$' } | Select-Object -First 1
          if (-not $command) { $command = $candidates | Select-Object -First 1 }
          if (-not $command) { throw "opencode tidak ada di PATH setelah npm install -g" }
          Write-Host "Dipilih  : $($command.Source)"
          "opencode_path=$($command.Source)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Uji perilaku dev-safe.ps1
        id: tests
        env:
          INCLUDE_E2E: ${{ github.event_name != 'workflow_dispatch' || inputs.run_e2e }}
        run: |
          $arguments = @("-NoProfile", "-File", "script/dev-safe.tests.ps1")
          if ($env:INCLUDE_E2E -eq "true") { $arguments += "-IncludeE2E" }
          $opencodePath = "${{ steps.install.outputs.opencode_path }}"
          if ($opencodePath) { $arguments += @("-Opencode", $opencodePath) }
          Write-Host "Menjalankan: pwsh $($arguments -join ' ')"
          & pwsh @arguments
          exit $LASTEXITCODE

      - name: Diagnostik kalau uji gagal
        if: failure()
        env:
          E2E_PORT: "42999"
        run: |
          # Step ini hanya untuk membantu diagnosa, jadi tidak boleh ikut gagal.
          $ErrorActionPreference = "Continue"
          function Show-Log([string]$Label, [string]$Path) {
            Write-Host "-- $Label --"
            Get-Content $Path -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
          }

          Write-Host "== Versi opencode =="
          $command = Get-Command opencode -ErrorAction SilentlyContinue
          if ($command) {
            Write-Host "path: $($command.Source) ($($command.CommandType))"
            try { & $command.Source --version 2>&1 | ForEach-Object { Write-Host $_ } } catch { Write-Host "gagal query versi: $($_.Exception.Message)" }
          } else {
            Write-Host "opencode tidak ada di PATH"
          }

          Write-Host "== netstat port $env:E2E_PORT =="
          netstat -ano | Select-String ":$env:E2E_PORT" | ForEach-Object { Write-Host $_.Line.Trim() }

          Write-Host "== Isi shim npm dan paketnya =="
          $prefix = (npm prefix -g).Trim()
          Write-Host "npm prefix: $prefix"
          Get-ChildItem $prefix -Filter "opencode*" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "  shim: $($_.Name) ($($_.Length) byte)"
          }
          foreach ($shim in @("opencode.ps1", "opencode.cmd")) {
            $path = Join-Path $prefix $shim
            if (Test-Path $path) {
              Write-Host "-- isi $shim --"
              Get-Content $path | ForEach-Object { Write-Host "  $_" }
            }
          }
          $binDir = Join-Path $prefix "node_modules\opencode-ai\bin"
          Write-Host "-- isi $binDir --"
          Get-ChildItem $binDir -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "  $($_.Name) ($([Math]::Round($_.Length / 1MB, 2)) MB)"
          }

          Write-Host "== Coba jalankan server langsung (25 detik, tanpa dev-safe.ps1) =="
          $outFile = Join-Path $env:RUNNER_TEMP "direct-serve.out"
          $errFile = Join-Path $env:RUNNER_TEMP "direct-serve.err"
          $env:OPENCODE_SERVER_PASSWORD = "ci-diagnostic"
          $directCandidates = Get-Command opencode -All -ErrorAction SilentlyContinue
          $direct = $directCandidates | Where-Object { $_.Source -match '\.(exe|cmd)$' } | Select-Object -First 1
          if (-not $direct) { $direct = $directCandidates | Select-Object -First 1 }
          if (-not $direct) {
            Write-Host "Tidak ada opencode untuk dijalankan; lewati percobaan server langsung."
          } else {
            Write-Host "Menjalankan: $($direct.Source) serve --port $env:E2E_PORT --hostname 127.0.0.1"
            try {
              $process = Start-Process -FilePath $direct.Source -ArgumentList @("serve", "--port", $env:E2E_PORT, "--hostname", "127.0.0.1") `
                -NoNewWindow -PassThru -RedirectStandardOutput $outFile -RedirectStandardError $errFile
              Start-Sleep -Seconds 25
              $process.Refresh()
              if ($process.HasExited) { Write-Host "server langsung sudah keluar, kode $($process.ExitCode)" }
              else { Write-Host "server langsung masih hidup setelah 25 detik"; & taskkill /PID $process.Id /T /F 2>&1 | Out-Null }
            } catch {
              Write-Host "Percobaan server langsung gagal dijalankan: $($_.Exception.Message)"
            }
            Show-Log "stdout" $outFile
            Show-Log "stderr" $errFile
            Write-Host "== netstat setelah percobaan =="
            netstat -ano | Select-String ":$env:E2E_PORT" | ForEach-Object { Write-Host $_.Line.Trim() }
          }

      - name: Lampirkan ringkasan hasil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-safe-summary
          path: |
            dev-safe-summary.md
            dev-safe-failures.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Pastikan uji e2e tidak diam-diam dilewati
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.run_e2e) }}
        run: |
          $summary = Get-Content "dev-safe-summary.md" -Raw
          $expected = @("Server nyata", "-WithDevUi")
          foreach ($needle in $expected) {
            $row = ($summary -split "`n" | Where-Object { $_ -match [regex]::Escape($needle) })
            if (-not $row) { throw "Baris uji '$needle' tidak ada di ringkasan" }
            if ($row -match "dilewati") { throw "Uji '$needle' dilewati padahal diminta berjalan: $row" }
            if ($row -notmatch "lulus") { throw "Uji '$needle' tidak lulus: $row" }
            Write-Host "OK: $($row.Trim())"
          }

      - name: Ringkasan hasil
        if: always()
        run: |
          $summary = $env:GITHUB_STEP_SUMMARY
          Add-Content -Path $summary -Value ""
          Add-Content -Path $summary -Value "Perintah untuk mencoba sendiri di Windows:"
          Add-Content -Path $summary -Value '```powershell'
          Add-Content -Path $summary -Value "powershell -ExecutionPolicy Bypass -File .\script\dev-safe.ps1 -WithDevUi"
          Add-Content -Path $summary -Value "powershell -ExecutionPolicy Bypass -File .\script\dev-safe.ps1 -Verify"
          Add-Content -Path $summary -Value "pwsh -NoProfile -File .\script\dev-safe.tests.ps1"
          Add-Content -Path $summary -Value '```'
